# This workflow runs in a public repository. Compiler and dependency logs are public;
# dispatch only Omi commits approved for that exposure. Signed artifacts are encrypted.
name: Build Omi iOS

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable 40-hex Omi source commit SHA
        required: true
        type: string
      mode:
        description: Build mode
        required: true
        default: verify
        type: choice
        options:
          - verify
          - unsigned
          - signed

permissions:
  contents: read

jobs:
  validate-source-sha:
    name: Validate immutable Omi source SHA
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout public runner contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce public Omi iOS workflow trust contract
        run: python3 .github/scripts/test_build_omi_ios_workflow.py

      - name: Accept only a full commit SHA
        id: validate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo '::error::source_sha must be a full 40-hex commit SHA.'
            exit 1
          fi
          printf 'source_sha=%s\n' "${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

  verify-ios:
    name: Verify Omi iOS and Jags parity
    if: github.ref == 'refs/heads/main' && inputs.mode == 'verify'
    needs: validate-source-sha
    runs-on: macos-15
    environment: omi-ios-source-read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Admit and checkout protected Omi main source
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          OMI_SOURCE_DEPLOY_KEY: ${{ secrets.OMI_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_key="$(mktemp "$RUNNER_TEMP/omi-source-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/omi-known-hosts.XXXXXX")"
          cleanup_source_key() {
            rm -f "$deploy_key" "$known_hosts"
          }
          trap cleanup_source_key EXIT
          printf '%s\n' "$OMI_SOURCE_DEPLOY_KEY" > "$deploy_key"
          unset OMI_SOURCE_DEPLOY_KEY
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          expected_fingerprint='SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GIT_SSH_COMMAND="ssh -i '$deploy_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'"
          git init --quiet .
          git remote add origin git@github.com:n4s5ti/0mi.git
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git remote remove origin
          unset GIT_SSH_COMMAND
          cleanup_source_key
          trap - EXIT
          test ! -e "$deploy_key"
          test ! -e "$known_hosts"
          git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select and verify pinned Xcode
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          actual="$(xcodebuild -version)"
          expected=$'Xcode 16.4\nBuild version 16F6'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected ${expected//$'\n'/, }, found ${actual//$'\n'/, }"
            exit 1
          fi

      - name: Require committed frozen Swift package resolution
        run: |
          set -euo pipefail
          resolution='app/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ ! -f "$resolution" ] || ! git ls-files --error-unmatch "$resolution" >/dev/null 2>&1; then
            echo "::error::Missing checked-in Xcode SwiftPM resolution: ${resolution}"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: false

      - name: Set up pinned Ruby and Bundler
        id: ruby-toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.3.12
          bundler: 4.0.3
          bundler-cache: false
          working-directory: app/ios

      - name: Verify pinned Ruby toolchain
        env:
          PINNED_RUBY_PREFIX: ${{ steps.ruby-toolchain.outputs.ruby-prefix }}
        run: |
          set -euo pipefail
          ruby_bin="$PINNED_RUBY_PREFIX/bin"
          export PATH="$ruby_bin:$PATH"
          test "$(command -v ruby)" = "$ruby_bin/ruby"
          test "$(command -v bundle)" = "$ruby_bin/bundle"
          test "$("$ruby_bin/ruby" -e 'print RUBY_VERSION')" = '3.3.12'
          test "$("$ruby_bin/bundle" --version)" = '4.0.3'
          echo "$ruby_bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter dev build inputs
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          mkdir -p ios/Config/Dev ios/Config/Prod ios/Runner
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_dev.dart
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_prod.dart
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Dev/
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Prod/
          cp setup/prebuilt/GoogleService-Info.plist ios/Runner/
          bash scripts/generate_ios_custom_config.sh ios/Config/Dev/GoogleService-Info.plist ios/Flutter
          cat > .dev.env <<'EOF'
          API_BASE_URL=https://api.omiapi.com/
          USE_WEB_AUTH=true
          USE_AUTH_CUSTOM_TOKEN=true
          STAGING_API_URL=
          EOF
          : > .env
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: |
          set -euo pipefail
          bundle config set --local deployment true
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3
          mkdir -p "$RUNNER_TEMP/bundle-bin"
          install -m 700 "$GITHUB_WORKSPACE/.github/scripts/run-bundled-cocoapods.sh" "$RUNNER_TEMP/bundle-bin/pod"
          echo "$RUNNER_TEMP/bundle-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bundle-bin/pod" --version)" = '1.16.2'
          "$RUNNER_TEMP/bundle-bin/pod" install --deployment

      - name: Run mandatory Jags parity simulator tests
        working-directory: app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Runner.xcodeproj \
            -scheme JagsParityTests \
            -disableAutomaticPackageResolution \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5'

      - name: Build unsigned iOS dev app
        working-directory: app
        run: BUNDLE_GEMFILE=ios/Gemfile bundle exec flutter build ios --release --flavor dev --no-codesign

  signed-ios:
    name: Build signed Omi iOS IPA
    if: github.ref == 'refs/heads/main' && inputs.mode == 'signed'
    needs: validate-source-sha
    runs-on: macos-15
    environment: omi-ios-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Admit and checkout protected Omi main source
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          OMI_SOURCE_DEPLOY_KEY: ${{ secrets.OMI_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_key="$(mktemp "$RUNNER_TEMP/omi-source-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/omi-known-hosts.XXXXXX")"
          cleanup_source_key() {
            rm -f "$deploy_key" "$known_hosts"
          }
          trap cleanup_source_key EXIT
          printf '%s\n' "$OMI_SOURCE_DEPLOY_KEY" > "$deploy_key"
          unset OMI_SOURCE_DEPLOY_KEY
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          expected_fingerprint='SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GIT_SSH_COMMAND="ssh -i '$deploy_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'"
          git init --quiet .
          git remote add origin git@github.com:n4s5ti/0mi.git
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git remote remove origin
          unset GIT_SSH_COMMAND
          cleanup_source_key
          trap - EXIT
          test ! -e "$deploy_key"
          test ! -e "$known_hosts"
          git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select and verify pinned Xcode
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          actual="$(xcodebuild -version)"
          expected=$'Xcode 16.4\nBuild version 16F6'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected ${expected//$'\n'/, }, found ${actual//$'\n'/, }"
            exit 1
          fi

      - name: Require committed frozen Swift package resolution
        run: |
          set -euo pipefail
          resolution='app/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ ! -f "$resolution" ] || ! git ls-files --error-unmatch "$resolution" >/dev/null 2>&1; then
            echo "::error::Missing checked-in Xcode SwiftPM resolution: ${resolution}"
            exit 1
          fi

      - name: Validate protected signing secrets
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          IPA_ARTIFACT_ENCRYPTION_CERT_PEM: ${{ secrets.IPA_ARTIFACT_ENCRYPTION_CERT_PEM }}
        run: |
          set -euo pipefail
          for secret_name in \
            IOS_SIGNING_CERTIFICATE_BASE64 \
            IOS_SIGNING_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILES_BASE64 \
            IPA_ARTIFACT_ENCRYPTION_CERT_PEM; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required protected environment secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: false

      - name: Set up pinned Ruby and Bundler
        id: ruby-toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.3.12
          bundler: 4.0.3
          bundler-cache: false
          working-directory: app/ios

      - name: Verify pinned Ruby toolchain
        env:
          PINNED_RUBY_PREFIX: ${{ steps.ruby-toolchain.outputs.ruby-prefix }}
        run: |
          set -euo pipefail
          ruby_bin="$PINNED_RUBY_PREFIX/bin"
          export PATH="$ruby_bin:$PATH"
          test "$(command -v ruby)" = "$ruby_bin/ruby"
          test "$(command -v bundle)" = "$ruby_bin/bundle"
          test "$("$ruby_bin/ruby" -e 'print RUBY_VERSION')" = '3.3.12'
          test "$("$ruby_bin/bundle" --version)" = '4.0.3'
          echo "$ruby_bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter dev build inputs
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          mkdir -p ios/Config/Dev ios/Config/Prod ios/Runner
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_dev.dart
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_prod.dart
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Dev/
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Prod/
          cp setup/prebuilt/GoogleService-Info.plist ios/Runner/
          bash scripts/generate_ios_custom_config.sh ios/Config/Dev/GoogleService-Info.plist ios/Flutter
          cat > .dev.env <<'EOF'
          API_BASE_URL=https://api.omiapi.com/
          USE_WEB_AUTH=true
          USE_AUTH_CUSTOM_TOKEN=true
          STAGING_API_URL=
          EOF
          : > .env
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: |
          set -euo pipefail
          bundle config set --local deployment true
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3
          mkdir -p "$RUNNER_TEMP/bundle-bin"
          install -m 700 "$GITHUB_WORKSPACE/.github/scripts/run-bundled-cocoapods.sh" "$RUNNER_TEMP/bundle-bin/pod"
          echo "$RUNNER_TEMP/bundle-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bundle-bin/pod" --version)" = '1.16.2'
          "$RUNNER_TEMP/bundle-bin/pod" install --deployment

      - name: Run mandatory Jags parity simulator tests
        working-directory: app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Runner.xcodeproj \
            -scheme JagsParityTests \
            -disableAutomaticPackageResolution \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5'

      - name: Build, sign, and verify dev IPA
        env:
          OMI_SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
        run: bash .github/scripts/build-signed-ios-dev-ipa.sh

      - name: Encrypt signed IPA artifact and publish-safe summary
        env:
          OMI_SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          IPA_ARTIFACT_ENCRYPTION_CERT_PEM: ${{ secrets.IPA_ARTIFACT_ENCRYPTION_CERT_PEM }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/omi-ios-artifact"
          recipient_cert="$RUNNER_TEMP/omi-ios-artifact-recipient.pem"
          archive="$RUNNER_TEMP/omi-ios-artifact.tar.gz"
          ciphertext="$artifact_dir/omi-ios-artifact.tar.gz.cms"
          summary="$artifact_dir/public-summary.txt"
          mkdir -p "$artifact_dir"
          printf '%s' "$IPA_ARTIFACT_ENCRYPTION_CERT_PEM" > "$recipient_cert"
          chmod 600 "$recipient_cert"
          tar -C "$RUNNER_TEMP/ios-dev-ipa" -czf "$archive" omi-dev.ipa receipt.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$archive" \
            -out "$ciphertext" \
            "$recipient_cert"
          ciphertext_sha256="$(shasum -a 256 "$ciphertext" | awk '{print $1}')"
          printf 'source_sha=%s\nciphertext_sha256=%s\n' "$OMI_SOURCE_SHA" "$ciphertext_sha256" > "$summary"
          unset IPA_ARTIFACT_ENCRYPTION_CERT_PEM
          rm -f "$archive" "$recipient_cert"
          rm -rf "$RUNNER_TEMP/ios-dev-ipa"

      - name: Upload encrypted signed IPA artifact and public summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omi-dev-ipa-${{ needs.validate-source-sha.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/omi-ios-artifact/omi-ios-artifact.tar.gz.cms
            ${{ runner.temp }}/omi-ios-artifact/public-summary.txt
          if-no-files-found: error
          retention-days: 14

  unsigned-ipa:
    name: Build unsigned Omi iOS IPA for local signing
    if: github.ref == 'refs/heads/main' && inputs.mode == 'unsigned'
    needs: validate-source-sha
    runs-on: macos-15
    environment: omi-ios-source-read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Admit and checkout protected Omi main source
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          OMI_SOURCE_DEPLOY_KEY: ${{ secrets.OMI_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_key="$(mktemp "$RUNNER_TEMP/omi-source-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/omi-known-hosts.XXXXXX")"
          cleanup_source_key() {
            rm -f "$deploy_key" "$known_hosts"
          }
          trap cleanup_source_key EXIT
          printf '%s\n' "$OMI_SOURCE_DEPLOY_KEY" > "$deploy_key"
          unset OMI_SOURCE_DEPLOY_KEY
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          expected_fingerprint='SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GIT_SSH_COMMAND="ssh -i '$deploy_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'"
          git init --quiet .
          git remote add origin git@github.com:n4s5ti/0mi.git
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git remote remove origin
          unset GIT_SSH_COMMAND
          cleanup_source_key
          trap - EXIT
          test ! -e "$deploy_key"
          test ! -e "$known_hosts"
          git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select and verify pinned Xcode
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          actual="$(xcodebuild -version)"
          expected=$'Xcode 16.4\nBuild version 16F6'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected ${expected//$'\n'/, }, found ${actual//$'\n'/, }"
            exit 1
          fi

      - name: Require committed frozen Swift package resolution
        run: |
          set -euo pipefail
          resolution='app/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ ! -f "$resolution" ] || ! git ls-files --error-unmatch "$resolution" >/dev/null 2>&1; then
            echo "::error::Missing checked-in Xcode SwiftPM resolution: ${resolution}"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: false

      - name: Set up pinned Ruby and Bundler
        id: ruby-toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.3.12
          bundler: 4.0.3
          bundler-cache: false
          working-directory: app/ios

      - name: Verify pinned Ruby toolchain
        env:
          PINNED_RUBY_PREFIX: ${{ steps.ruby-toolchain.outputs.ruby-prefix }}
        run: |
          set -euo pipefail
          ruby_bin="$PINNED_RUBY_PREFIX/bin"
          export PATH="$ruby_bin:$PATH"
          test "$(command -v ruby)" = "$ruby_bin/ruby"
          test "$(command -v bundle)" = "$ruby_bin/bundle"
          test "$("$ruby_bin/ruby" -e 'print RUBY_VERSION')" = '3.3.12'
          test "$("$ruby_bin/bundle" --version)" = '4.0.3'
          echo "$ruby_bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter dev build inputs
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          mkdir -p ios/Config/Dev ios/Config/Prod ios/Runner
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_dev.dart
          cp setup/prebuilt/firebase_options.dart lib/firebase_options_prod.dart
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Dev/
          cp setup/prebuilt/GoogleService-Info.plist ios/Config/Prod/
          cp setup/prebuilt/GoogleService-Info.plist ios/Runner/
          bash scripts/generate_ios_custom_config.sh ios/Config/Dev/GoogleService-Info.plist ios/Flutter
          printf '%s\n' 'APP_BUNDLE_IDENTIFIER=com.friend-app-with-wearable.ios12.development' >> ios/Flutter/Custom.xcconfig
          cat > .dev.env <<'EOF'
          API_BASE_URL=https://api.omiapi.com/
          USE_WEB_AUTH=true
          USE_AUTH_CUSTOM_TOKEN=true
          STAGING_API_URL=
          EOF
