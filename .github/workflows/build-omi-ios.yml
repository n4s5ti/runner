          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: |
          set -euo pipefail
          bundle config set --local deployment true
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3
          mkdir -p "$RUNNER_TEMP/bundle-bin"
          install -m 700 "$GITHUB_WORKSPACE/.github/scripts/run-bundled-cocoapods.sh" "$RUNNER_TEMP/bundle-bin/pod"
          echo "$RUNNER_TEMP/bundle-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bundle-bin/pod" --version)" = '1.16.2'
          "$RUNNER_TEMP/bundle-bin/pod" install --deployment

      - name: Run mandatory Jags parity simulator tests
        working-directory: app/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Runner.xcodeproj \
            -scheme JagsParityTests \
            -disableAutomaticPackageResolution \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5'

      - name: Build unsigned iOS dev app
        working-directory: app
        run: BUNDLE_GEMFILE=ios/Gemfile bundle exec flutter build ios --release --flavor dev --no-codesign

      - name: Package unsigned dev IPA and receipt
        env:
          OMI_SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
        run: |
          set -euo pipefail
          expected_bundle_id='com.friend-app-with-wearable.ios12.development'
          app_dir="$GITHUB_WORKSPACE/app/build/ios/iphoneos/Runner.app"
          info_plist="$app_dir/Info.plist"
          firebase_plist="$app_dir/GoogleService-Info.plist"
          test -d "$app_dir"
          test -f "$info_plist"
          test -f "$firebase_plist"
          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          firebase_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$firebase_plist")"
          test "$app_bundle_id" = "$expected_bundle_id"
          test "$firebase_bundle_id" = "$expected_bundle_id"
          staging="$RUNNER_TEMP/ios-dev-ipa"
          mkdir -p "$staging/Payload"
          cp -R "$app_dir" "$staging/Payload/Runner.app"
          (cd "$staging" && zip -qry omi-dev.ipa Payload)
          rm -rf "$staging/Payload"
          ipa_sha256="$(shasum -a 256 "$staging/omi-dev.ipa" | awk '{print $1}')"
          printf 'source_sha=%s\nmode=unsigned\nbundle_id=%s\nsha256=%s\n' "$OMI_SOURCE_SHA" "$app_bundle_id" "$ipa_sha256" > "$staging/receipt.txt"

      - name: Encrypt unsigned IPA artifact and publish-safe summary
        env:
          OMI_SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          IPA_ARTIFACT_ENCRYPTION_CERT_PEM: ${{ secrets.IPA_ARTIFACT_ENCRYPTION_CERT_PEM }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/omi-ios-artifact"
          recipient_cert="$RUNNER_TEMP/omi-ios-artifact-recipient.pem"
          archive="$RUNNER_TEMP/omi-ios-artifact.tar.gz"
          ciphertext="$artifact_dir/omi-ios-artifact.tar.gz.cms"
          summary="$artifact_dir/public-summary.txt"
          mkdir -p "$artifact_dir"
          printf '%s' "$IPA_ARTIFACT_ENCRYPTION_CERT_PEM" > "$recipient_cert"
          chmod 600 "$recipient_cert"
          tar -C "$RUNNER_TEMP/ios-dev-ipa" -czf "$archive" omi-dev.ipa receipt.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$archive" \
            -out "$ciphertext" \
            "$recipient_cert"
          ciphertext_sha256="$(shasum -a 256 "$ciphertext" | awk '{print $1}')"
          printf 'source_sha=%s\nciphertext_sha256=%s\n' "$OMI_SOURCE_SHA" "$ciphertext_sha256" > "$summary"
          unset IPA_ARTIFACT_ENCRYPTION_CERT_PEM
          rm -f "$archive" "$recipient_cert"
          rm -rf "$RUNNER_TEMP/ios-dev-ipa"

      - name: Upload encrypted unsigned IPA artifact and public summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omi-dev-unsigned-ipa-${{ needs.validate-source-sha.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/omi-ios-artifact/omi-ios-artifact.tar.gz.cms
            ${{ runner.temp }}/omi-ios-artifact/public-summary.txt
          if-no-files-found: error
          retention-days: 14
