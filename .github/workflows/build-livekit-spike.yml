# This workflow runs in a public repository. Compiler and dependency logs are public;
# dispatch only omp-wakeword commits approved for that exposure. This lane compiles the
# OBS-1712 LiveKit-direct spike (spike/livekit-direct) for the iOS Simulator and an
# unsigned iOS device build as a CMS-encrypted artifact; plaintext binaries are never uploaded and it holds no signing secrets.
name: Build LiveKit spike

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable 40-hex omp-wakeword source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source-sha:
    name: Validate immutable omp-wakeword source SHA
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout public runner contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce public LiveKit spike workflow trust contract
        run: python3 .github/scripts/test_build_livekit_spike_workflow.py

      - name: Accept only a full commit SHA
        id: validate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo '::error::source_sha must be a full 40-hex commit SHA.'
            exit 1
          fi
          printf 'source_sha=%s\n' "${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

  build-livekit-spike:
    name: Build LiveKit direct-path spike (simulator + unsigned device)
    if: github.ref == 'refs/heads/main'
    needs: validate-source-sha
    runs-on: macos-15
    environment: omp-wakeword-source-read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Admit and checkout protected omp-wakeword spike source
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          OMP_WAKEWORD_DEPLOY_KEY: ${{ secrets.OMP_WAKEWORD_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          deploy_key="$(mktemp "$RUNNER_TEMP/omp-wakeword-source-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/omp-wakeword-known-hosts.XXXXXX")"
          cleanup_source_key() {
            rm -f "$deploy_key" "$known_hosts"
          }
          trap cleanup_source_key EXIT
          printf '%s\n' "$OMP_WAKEWORD_DEPLOY_KEY" > "$deploy_key"
          unset OMP_WAKEWORD_DEPLOY_KEY
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          expected_fingerprint='SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'
          test "$actual_fingerprint" = "$expected_fingerprint"
          export GIT_SSH_COMMAND="ssh -i '$deploy_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'"
          git init --quiet .
          git remote add origin git@github.com:n4s5ti/omp-wakeword.git
          git fetch --quiet --no-tags origin '+refs/heads/feature/livekit-direct-spike:refs/remotes/origin/feature/livekit-direct-spike'
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/feature/livekit-direct-spike
          git remote remove origin
          unset GIT_SSH_COMMAND
          cleanup_source_key
          trap - EXIT
          test ! -e "$deploy_key"
          test ! -e "$known_hosts"
          git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select and verify pinned Xcode
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          actual="$(xcodebuild -version)"
          expected=$'Xcode 16.4\nBuild version 16F6'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected ${expected//$'\n'/, }, found ${actual//$'\n'/, }"
            exit 1
          fi

      - name: Require the spike project spec to exist in the admitted source
        run: |
          set -euo pipefail
          spec='spike/livekit-direct/project.yml'
          if [ ! -f "$spec" ] || ! git ls-files --error-unmatch "$spec" >/dev/null 2>&1; then
            echo "::error::Missing checked-in xcodegen project spec: ${spec}"
            exit 1
          fi

      - name: Install xcodegen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: spike/livekit-direct
        run: |
          set -euo pipefail
          xcodegen generate
          test -d LiveKitSpike.xcodeproj

      - name: Build the spike for the iOS Simulator
        id: build
        working-directory: spike/livekit-direct
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/livekit-spike-build"
          mkdir -p "$log_dir"
          log="$log_dir/xcodebuild.log"
          status=0
          set -o pipefail
          xcodebuild build \
            -project LiveKitSpike.xcodeproj \
            -scheme LiveKitSpike \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log" || status=$?
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build the spike for iOS device (unsigned)
        id: build-device
        working-directory: spike/livekit-direct
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/livekit-spike-build"
          mkdir -p "$log_dir"
          log="$log_dir/xcodebuild-device.log"
          status=0
          set -o pipefail
          xcodebuild build \
            -project LiveKitSpike.xcodeproj \
            -scheme LiveKitSpike \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/livekit-spike-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$log" || status=$?
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Package unsigned device IPA and receipt
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_app_dir="$RUNNER_TEMP/livekit-spike-dd/Build/Products/Release-iphoneos/LiveKitSpike.app"
          debug_app_dir="$RUNNER_TEMP/livekit-spike-dd/Build/Products/Debug-iphoneos/LiveKitSpike.app"
          if [ -d "$release_app_dir" ]; then
            app_dir="$release_app_dir"
          elif [ -d "$debug_app_dir" ]; then
            app_dir="$debug_app_dir"
          else
            echo '::error::No iOS device app bundle was produced.'
            exit 1
          fi
          test -f "$app_dir/Info.plist"
          staging="$RUNNER_TEMP/livekit-spike-dev-ipa"
          mkdir -p "$staging/Payload"
          cp -R "$app_dir" "$staging/Payload/LiveKitSpike.app"
          (cd "$staging" && zip -qry livekit-spike-dev.ipa Payload)
          rm -rf "$staging/Payload"
          ipa_sha256="$(shasum -a 256 "$staging/livekit-spike-dev.ipa" | awk '{print $1}')"
          printf 'source_sha=%s\nsha256=%s\n' "$SOURCE_SHA" "$ipa_sha256" > "$staging/receipt.txt"

      - name: Encrypt device IPA artifact and publish-safe summary
        env:
          SOURCE_SHA: ${{ needs.validate-source-sha.outputs.source_sha }}
          IPA_ARTIFACT_ENCRYPTION_CERT_PEM: ${{ secrets.IPA_ARTIFACT_ENCRYPTION_CERT_PEM }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/livekit-spike-artifact"
          recipient_cert="$RUNNER_TEMP/livekit-spike-artifact-recipient.pem"
          archive="$RUNNER_TEMP/livekit-spike-artifact.tar.gz"
          ciphertext="$artifact_dir/livekit-spike-artifact.tar.gz.cms"
          summary="$artifact_dir/public-summary.txt"
          mkdir -p "$artifact_dir"
          printf '%s' "$IPA_ARTIFACT_ENCRYPTION_CERT_PEM" > "$recipient_cert"
          chmod 600 "$recipient_cert"
          tar -C "$RUNNER_TEMP/livekit-spike-dev-ipa" -czf "$archive" livekit-spike-dev.ipa receipt.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$archive" \
            -out "$ciphertext" \
            "$recipient_cert"
          ciphertext_sha256="$(shasum -a 256 "$ciphertext" | awk '{print $1}')"
          printf 'source_sha=%s\nciphertext_sha256=%s\n' "$SOURCE_SHA" "$ciphertext_sha256" > "$summary"
          unset IPA_ARTIFACT_ENCRYPTION_CERT_PEM
          rm -f "$archive" "$recipient_cert"
          rm -rf "$RUNNER_TEMP/livekit-spike-dev-ipa"

      - name: Upload encrypted device IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: livekit-spike-dev-ipa-${{ needs.validate-source-sha.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/livekit-spike-artifact/livekit-spike-artifact.tar.gz.cms
            ${{ runner.temp }}/livekit-spike-artifact/public-summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcodebuild log
        # A failing compile is the payload of this lane, so the log must survive it.
        # Guarded on the build step actually having run: if an earlier step fails, no
        # log exists and `if-no-files-found: error` would mask the real failure.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: livekit-spike-xcodebuild-log-${{ needs.validate-source-sha.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/livekit-spike-build/xcodebuild.log
            ${{ runner.temp }}/livekit-spike-build/xcodebuild-device.log
          if-no-files-found: error
          retention-days: 14
