name: research-ollama

"on":
  workflow_dispatch:
    inputs:
      query:
        description: Research query
        required: true
        type: string
      destination_url:
        description: HTTPS endpoint that receives result JSON
        required: true
        type: string
      model:
        description: Ollama model
        required: false
        default: llama3.2:3b
        type: string
      temperature:
        description: Ollama temperature, 0.0 through 2.0
        required: false
        default: "0.2"
        type: string
  repository_dispatch:
    types: [research-request]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate request
        id: request
        run: |
          python scripts/resolve_request.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2

      - name: Pull model
        run: ollama pull "${{ steps.request.outputs.model }}"

      - name: Run research
        run: |
          python scripts/research_runner.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --output result.json

      - name: Post result
        run: |
          python scripts/post_result.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --result result.json
