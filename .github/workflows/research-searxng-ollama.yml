name: research-searxng-ollama

"on":
  workflow_dispatch:
    inputs:
      query:
        description: Research query
        required: true
        type: string
      destination_url:
        description: HTTPS endpoint that receives result JSON
        required: true
        type: string
      model:
        description: Ollama model
        required: false
        default: llama3.2:3b
        type: string
      temperature:
        description: Ollama temperature, 0.0 through 2.0
        required: false
        default: "0.2"
        type: string
      top_n:
        description: Number of SearXNG results to include, 1 through 10
        required: false
        default: "5"
        type: string
  repository_dispatch:
    types: [searxng-research-request]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      searxng:
        image: searxng/searxng:latest
        ports:
          - 8080:8080
        volumes:
          - ${{ github.workspace }}/searxng-config:/etc/searxng
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install SearXNG settings
        run: |
          sudo mkdir -p "$GITHUB_WORKSPACE/searxng-config"
          sudo cp "$GITHUB_WORKSPACE/source/config/searxng/settings.yml" "$GITHUB_WORKSPACE/searxng-config/settings.yml"
          sudo chmod 0644 "$GITHUB_WORKSPACE/searxng-config/settings.yml"
          docker restart "${{ job.services.searxng.id }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate request
        id: request
        run: |
          python source/scripts/resolve_request.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --include-top-n

      - name: Wait for SearXNG
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(60):
              try:
                  with urlopen('http://127.0.0.1:8080/', timeout=2) as response:
                      if response.status < 500:
                          print('SearXNG is reachable')
                          raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit('SearXNG did not become reachable')
          PY

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2

      - name: Pull model
        run: ollama pull "${{ steps.request.outputs.model }}"

      - name: Run research
        run: |
          python source/scripts/searxng_ollama_research.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --searxng-url http://127.0.0.1:8080 \
            --output result.json

      - name: Post result
        run: |
          python source/scripts/post_result.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --result result.json
