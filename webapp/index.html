<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vane Relay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #30363d;
      --text: #e1e4e8; --text-dim: #8b949e; --accent: #58a6ff;
      --green: #238636; --red: #da3633; --red-bg: #2d1215;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    #root { min-height: 100vh; }

    /* Layout */
    .vn-layout { display: flex; min-height: 100vh; }
    .vn-main { flex: 1; max-width: 820px; margin: 0 auto; padding: 24px 16px 120px; width: 100%; }

    /* Sidebar */
    .vn-sidebar {
      width: 260px; min-width: 260px; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      height: 100vh; position: sticky; top: 0; overflow-y: auto;
    }
    .vn-sidebar-collapsed { width: 48px; min-width: 48px; }
    .vn-sidebar-header {
      display: flex; gap: 4px; padding: 12px; border-bottom: 1px solid var(--border);
    }
    .vn-sidebar-toggle { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 6px 10px; }
    .vn-btn-icon {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 16px;
      flex: 1; text-align: center;
    }
    .vn-btn-icon:hover { background: var(--border); color: var(--text); }
    .vn-btn-x {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 18px; padding: 0 6px; line-height: 1; opacity: 0;
    }
    .vn-chat-item:hover .vn-btn-x { opacity: 1; }
    .vn-chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .vn-chat-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--text-dim); font-size: 13px; margin-bottom: 2px;
    }
    .vn-chat-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .vn-chat-active { background: rgba(88,166,255,0.1); color: var(--accent); }
    .vn-chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .vn-empty { padding: 16px; color: var(--text-dim); font-size: 13px; text-align: center; }

    /* Settings */
    .vn-settings {
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .vn-settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .vn-settings-header h3 { font-size: 14px; color: var(--text); }
    .vn-field { display: block; margin-bottom: 10px; }
    .vn-field span { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .vn-field input, .vn-field select {
      width: 100%; padding: 6px 10px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none;
    }
    .vn-field input:focus, .vn-field select:focus { border-color: var(--accent); }

    /* Search */
    .vn-search { margin-bottom: 32px; }
    .vn-search textarea {
      width: 100%; min-height: 60px; padding: 16px 20px;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; font-size: 16px; line-height: 1.5;
      resize: none; outline: none; font-family: inherit;
    }
    .vn-search textarea:focus { border-color: var(--accent); }
    .vn-search textarea:disabled { opacity: 0.5; }
    .vn-search-row {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center;
    }
    .vn-search-row select {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer;
    }
    .vn-search-row button {
      padding: 8px 20px; border-radius: 8px; border: none;
      background: var(--green); color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-left: auto;
    }
    .vn-search-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Messages */
    .vn-message { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .vn-query { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #f0f6fc; }
    .vn-answer { line-height: 1.7; font-size: 15px; color: #c9d1d9; }
    .vn-answer h1 { font-size: 22px; margin: 24px 0 12px; color: #f0f6fc; }
    .vn-answer h2 { font-size: 19px; margin: 20px 0 10px; color: #f0f6fc; }
    .vn-answer h3 { font-size: 16px; margin: 16px 0 8px; color: var(--text); }
    .vn-answer p { margin: 8px 0; }
    .vn-answer ul, .vn-answer ol { margin: 8px 0; padding-left: 24px; }
    .vn-answer li { margin: 4px 0; }
    .vn-answer code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .vn-answer pre { background: var(--surface); padding: 12px 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; font-size: 13px; }
    .vn-answer blockquote { border-left: 3px solid var(--accent); padding: 4px 16px; margin: 12px 0; color: var(--text-dim); }
    .vn-answer a { color: var(--accent); }
    .vn-answer table { border-collapse: collapse; margin: 12px 0; width: 100%; }
    .vn-answer th, .vn-answer td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 14px; }
    .vn-answer th { background: var(--surface); }

    /* Sources */
    .vn-sources { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .vn-source {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; font-size: 12px; color: var(--text-dim); text-decoration: none;
      max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .vn-source:hover { border-color: var(--accent); color: var(--text); }

    /* States */
    .vn-loading { display: flex; align-items: center; gap: 10px; padding: 20px; color: var(--text-dim); font-size: 14px; }
    .vn-spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top: 2px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vn-error { padding: 16px; background: var(--red-bg); border: 1px solid var(--red); border-radius: 12px; color: var(--red); margin: 16px 0; font-size: 14px; }
    .vn-error button { margin-top: 8px; padding: 6px 16px; background: var(--red); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .vn-empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); }
    .vn-empty-state h2 { font-size: 28px; color: var(--text); margin-bottom: 12px; }
    .vn-empty-state p { margin-bottom: 8px; font-size: 15px; }
    .vn-hint { font-size: 13px; color: var(--text-dim); margin-top: 16px; opacity: 0.7; }

    /* Mobile */
    @media (max-width: 768px) {
      .vn-sidebar { display: none; }
      .vn-main { padding: 16px 12px 100px; }
    }
  </style>
  <!-- Dependencies from CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.mjs" type="module"></script>
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.min.js"></script>
  <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="root">
    <div class="vn-layout">
      <div class="vn-main">
        <div class="vn-loading"><div class="vn-spinner"></div>Loading Vane Relay...</div>
      </div>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
